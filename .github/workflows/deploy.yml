name: Build & Deploy to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite + SSR merge)
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload dist-ssr artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-ssr
          path: dist-ssr/

  commit-assets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Download dist-ssr
        uses: actions/download-artifact@v4
        with:
          name: dist-ssr
          path: dist-ssr

      - name: Commit build artifacts
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/ dist-ssr/
          git commit -m "[build] $(date -u '+%Y-%m-%d %H:%M UTC') auto-build by GitHub Actions" || echo "No changes to commit"
          git push origin main
