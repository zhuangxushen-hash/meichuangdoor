name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build SSR
        run: npm run build

      - name: Push dist-ssr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || git reset --hard origin/main
          git add -f dist-ssr/
          git commit -m "auto-build: 2026-10-26 20:12 UTC" || echo "no changes"
          git push origin main --force-with-lease --force-if-includes